@if (showIcon()) {
  <span class="ngx-callout__icon" [id]="ids().icon" role="img" [attr.aria-label]="stateLabel()">
    <ng-content select="[ngxCalloutIcon]">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        @switch (type()) {
          @case (MessageState.Warning) {
            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          }
          @case (MessageState.Error) {
            <circle cx="12" cy="12" r="10" />
            <path d="m15 9-6 6" />
            <path d="m9 9 6 6" />
          }
          @case (MessageState.Success) {
            <circle cx="12" cy="12" r="10" />
            <path d="m8.5 12.5 2.5 2.5 5-5.5" />
          }
          @default {
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-5" />
            <path d="M12 8h.01" />
          }
        }
      </svg>
    </ng-content>
  </span>
}

<div class="ngx-callout__body" [id]="ids().body">
  @if (hasHeading()) {
    <div class="ngx-callout__heading" [id]="ids().heading">
      <ng-content select="[ngxCalloutHeading]">{{ heading() }}</ng-content>
    </div>
  }
  @if (subheading()) {
    <div class="ngx-callout__subheading" [id]="ids().subheading">{{ subheading() }}</div>
  }
  <div class="ngx-callout__content" [id]="ids().content"><ng-content /></div>
</div>
